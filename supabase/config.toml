# Supabase configuration for Paridhan

project_id = "paridhan"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.create-razorpay-order]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

[functions.expire-stale-bargains]
verify_jwt = false
# Hourly cron schedule to expire stale open/countered bargains past 24 hours
schedule = "0 * * * *"

[functions.send-push-notification]
verify_jwt = true
